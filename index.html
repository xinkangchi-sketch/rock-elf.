function score(p, h, w){
  let ph = (p.height_min + p.height_max)/2;
  let pw = (p.weight_min + p.weight_max)/2;
  return Math.sqrt((ph-h)**2 + (pw-w)**2);
}

  let h = parseFloat(document.getElementById("height").value);
  let w = parseFloat(document.getElementById("weight").value);
  let t = parseFloat(document.getElementById("tol").value);

  let res = data.filter(p =>
    h+t >= p.height_min &&
    h-t <= p.height_max &&
    w+t >= p.weight_min &&
    w-t <= p.weight_max
  );

  res.sort((a,b)=>score(a,h,w)-score(b,h,w));

  let html = "";

  if(res.length === 0){
    html = "没有匹配精灵";
  }else{
    res.forEach(p=>{
      html += `
      <div class="card">
        <h4>${p.name}</h4>
        <img src="${p.image}" onerror="this.style.display='none'">
      </div>`;
    });
  }

  document.getElementById("result").innerHTML = html;
}

</script>
